<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MS2109 wireless camera</title>
<style>
body{margin:0;background:#111820;color:#eef3f7;font:16px system-ui}main{max-width:1000px;margin:auto;padding:24px}
h1{font-size:24px}img{width:100%;aspect-ratio:16/9;height:auto;object-fit:contain;background:#000;border-radius:8px}
a,button{color:#a7dcff}button{background:#253545;border:1px solid #52718a;padding:8px;border-radius:6px}pre{white-space:pre-wrap}
</style><main><h1>MS2109 wireless camera</h1><p id="state">Connecting to the capture card…</p>
<img id="video" alt="Live HDMI capture"><p><a href="/snapshot.jpg" target="_blank">Open snapshot</a> · <a href="/logs">Device logs</a>
 · <button id="details">Show details</button> · <button id="restart">Reconnect video</button></p>
<pre id="stats" hidden></pre><p>Tap the ESP32 screen to toggle image details. Hold it for 2 seconds to open Wi-Fi setup.
One browser can view the continuous stream at a time.</p></main>
<script>
const video=document.getElementById('video'),state=document.getElementById('state'),stats=document.getElementById('stats');
let retry,last=0,lastTime=performance.now(),awaitingRecovery=false;
function connect(){clearTimeout(retry);video.src='http://'+location.hostname+':81/stream?t='+Date.now()}
video.onerror=()=>{retry=setTimeout(connect,2000)};
document.getElementById('restart').onclick=connect;
document.getElementById('details').onclick=e=>{stats.hidden=!stats.hidden;e.target.textContent=stats.hidden?'Show details':'Hide details'};
async function poll(){
 try{const r=await fetch('/status',{cache:'no-store'});if(!r.ok)throw Error('status');const s=await r.json();
 const now=performance.now(),fps=(s.sequence-last)*1000/(now-lastTime);last=s.sequence;lastTime=now;
 state.textContent=s.connected&&s.age_ms>=0&&s.age_ms<3000?'Live · '+s.width+' × '+s.height+' · '+fps.toFixed(1)+' fps':'Waiting for video — check HDMI source and USB-A HS connection';
 if(s.width&&s.height)video.style.aspectRatio=s.width+'/'+s.height;
 stats.textContent=JSON.stringify(s,null,2);
 // A stream can end cleanly during a capture outage; img.onerror is not guaranteed.
 const fresh=s.connected&&s.age_ms>=0&&s.age_ms<3000;
 if(fresh&&awaitingRecovery){connect();awaitingRecovery=false}
 if(!fresh)awaitingRecovery=true;
 }catch(e){awaitingRecovery=true;state.textContent='Device unavailable — reconnect to the same Wi-Fi network'}
 setTimeout(poll,1000);
}
connect();poll();
</script></html>
